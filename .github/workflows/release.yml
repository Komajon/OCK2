name: OCK Android Build

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - "builds/**"
  pull_request:
  workflow_dispatch:
  release:
    types: [ published ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APKs
        run: gradle :app:assembleDebug :app:assembleRelease --no-daemon

      # Store the debug APK directly in the repository. This avoids the
      # GitHub Actions artifact-storage quota entirely.
      - name: Publish APK into repository
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          mkdir -p builds
          cp app/build/outputs/apk/debug/app-debug.apk builds/OCK-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f builds/OCK-debug.apk
          if git diff --cached --quiet; then
            echo "APK is unchanged; no repository commit is needed."
          else
            git commit -m "Build OCK APK #${GITHUB_RUN_NUMBER}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      # When a GitHub Release is published, attach both APK variants to it.
      - name: Attach APKs to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
